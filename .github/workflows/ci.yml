name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Verify backend types, architecture, and tests
        run: npm run verify

      - name: Verify frontend types, architecture, and tests
        run: npm --prefix web run verify

      - name: Build production artifacts
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install content engine and test dependencies
        working-directory: edu7-content-engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Test content engine
        working-directory: edu7-content-engine
        run: python -m pytest
