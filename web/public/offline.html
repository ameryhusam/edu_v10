<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edu7 — Offline</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0b1020; color: #e5eefc; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      main { max-width: 520px; border: 1px solid rgba(148,163,184,.35); border-radius: 24px; padding: 28px; background: rgba(15,23,42,.82); box-shadow: 0 24px 60px rgba(0,0,0,.25); }
      h1 { margin: 0 0 12px; font-size: 1.45rem; }
      p { margin: 0; line-height: 1.8; color: #b6c4d8; }
    </style>
  </head>
  <body>
    <main>
      <h1>أنت غير متصل الآن</h1>
      <p>سيعود Edu7 للعمل تلقائيًا عند توفر الاتصال. لا يتم تخزين إجابات الاختبارات الحساسة في هذه الصفحة؛ أعد المحاولة بعد الاتصال بالشبكة.</p>
    </main>
  </body>
</html>
