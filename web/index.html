<!doctype html>
<!--
  dir and lang are placeholders: the real values are written by the i18n layer
  from the authenticated user's locale, before React paints. Arabic is the
  default because User.locale defaults to "ar".
-->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The base theme is dark («Nebula» identity); only a stored light
         choice flips it, which React does before first paint. -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <title>Edu7</title>
    <meta name="description" content="Adaptive learning platform with student, teacher, guardian, and administrative dashboards." />
    <meta property="og:title" content="Edu7" />
    <meta property="og:description" content="Adaptive learning platform with student, teacher, guardian, and administrative dashboards." />
    <!-- The «Nebula» faces: Cairo for Arabic, Plus Jakarta Sans for Latin. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
