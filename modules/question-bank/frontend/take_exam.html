<!-- update take_exam.html to support drag/drop matching & ordering and use apiFetch -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Take Exam</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Take Exam</h1>
  <div>
    <label>Exam ID: <input id="examId"></label>
    <button id="start">Start</button>
  </div>
  <div id="questionArea"></div>
  <div id="controls"></div>
  <script type="module">
    import { apiFetch } from './api.js';
    let attemptId = null;
    let currentItem = null;

    document.getElementById('start').addEventListener('click', async () => {
      const examId = document.getElementById('examId').value;
      const res = await apiFetch(`/api/v1/exams/${encodeURIComponent(examId)}/start`, { method: 'POST' });
      attemptId = res.attemptId;
      renderQuestion(res.item);
    });

    function renderQuestion(item) {
      currentItem = item;
      const area = document.getElementById('questionArea'); area.innerHTML = '';
      const q = item.question;
      const h = document.createElement('h2'); h.innerText = q.text; area.appendChild(h);

      if (q.type === 'MCQ_SINGLE' || q.type === 'MCQ_MULTI') {
        const opts = q.answerData?.options || [];
        opts.forEach(opt => {
          const inp = document.createElement('input'); inp.type = q.type === 'MCQ_MULTI' ? 'checkbox' : 'radio'; inp.name = 'opt'; inp.value = opt.id;
          const lab = document.createElement('label'); lab.appendChild(inp); lab.append(' ' + opt.text);
          area.appendChild(lab); area.appendChild(document.createElement('br'));
        });
      } else if (q.type === 'TRUE_FALSE') {
        ['true','false'].forEach(v => { const b = document.createElement('button'); b.innerText = v; b.addEventListener('click', () => submitAnswer({ value: v === 'true' })); area.appendChild(b); });
      } else if (q.type === 'MATCHING') {
        // build drag/drop lists
        const left = q.answerData.left || [];
        const right = q.answerData.right || [];
        const leftCol = document.createElement('div'); leftCol.style.display='inline-block'; leftCol.style.marginRight='20px';
        leftCol.innerHTML = '<h4>Left</h4>';
        left.forEach(it => {
          const el = document.createElement('div'); el.draggable = true; el.id = 'left-' + it.id; el.className='draggable'; el.innerText = it.text;
          el.addEventListener('dragstart', (ev)=> { ev.dataTransfer.setData('text/plain', it.id); });
          leftCol.appendChild(el);
        });
        const rightCol = document.createElement('div'); rightCol.style.display='inline-block'; rightCol.innerHTML = '<h4>Right (drop here)</h4>';
        right.forEach(it => {
          const el = document.createElement('div'); el.id='right-'+it.id; el.className='dropzone'; el.innerText = it.text; el.dataset.rightId = it.id;
          el.addEventListener('dragover', (ev)=> ev.preventDefault());
          el.addEventListener('drop', (ev)=> {
            ev.preventDefault(); const leftId = ev.dataTransfer.getData('text/plain');
            // show mapping
            const mapping = document.createElement('div'); mapping.innerText = leftId + ' → ' + it.id; mapping.dataset.left = leftId; mapping.dataset.right = it.id;
            if (!el.querySelector('.maplist')) { const ul = document.createElement('div'); ul.className='maplist'; el.appendChild(ul); }
            el.querySelector('.maplist').appendChild(mapping);
          });
          rightCol.appendChild(el);
        });
        area.appendChild(leftCol); area.appendChild(rightCol);
      } else if (q.type === 'ORDERING') {
        const ul = document.createElement('ul'); ul.id='order-list'; ul.style.listStyle='none'; ul.style.padding='0';
        (q.answerData.items || []).forEach(it => {
          const li = document.createElement('li'); li.draggable = true; li.id = 'ord-' + it.id; li.innerText = it.text; li.style.padding='8px'; li.style.border='1px solid #ccc'; li.style.margin='4px 0';
          li.addEventListener('dragstart', (e)=> e.dataTransfer.setData('text/plain', it.id));
          li.addEventListener('dragover', (e)=> e.preventDefault());
          li.addEventListener('drop', (e)=> { e.preventDefault(); const dragged = e.dataTransfer.getData('text/plain'); const target = e.target; const draggedEl = document.getElementById('ord-'+dragged); ul.insertBefore(draggedEl, target.nextSibling); });
          ul.appendChild(li);
        });
        area.appendChild(ul);
      } else if (q.type === 'NUMERIC') {
        const inp = document.createElement('input'); inp.type='number'; inp.id='num'; area.appendChild(inp);
      } else if (q.type === 'SHORT_TEXT' || q.type === 'FILL_BLANK' || q.type === 'ESSAY') {
        const ta = document.createElement('textarea'); ta.id='text'; area.appendChild(ta);
      }
      const btn = document.createElement('button'); btn.innerText='Submit Answer'; btn.addEventListener('click', gatherAndSubmit); area.appendChild(btn);
      const sub = document.getElementById('controls'); sub.innerHTML = '';
      const end = document.createElement('button'); end.innerText='Finish & Submit Attempt'; end.addEventListener('click', finishAttempt); sub.appendChild(end);
    }

    async function gatherAndSubmit() {
      const q = currentItem.question;
      let payload = {};
      if (q.type === 'MCQ_SINGLE') {
        const sel = document.querySelector('input[name="opt"]:checked'); if (!sel) { alert('select'); return; } payload = { selectedOptionIds: [sel.value] };
      } else if (q.type === 'MCQ_MULTI') {
        const sels = Array.from(document.querySelectorAll('input[name="opt"]:checked')).map(i=>i.value);
        payload = { selectedOptionIds: sels };
      } else if (q.type === 'MATCHING') {
        const pairs = [];
        document.querySelectorAll('.dropzone').forEach(dz => {
          const rightId = dz.dataset.rightId;
          dz.querySelectorAll('.maplist > div').forEach(m => pairs.push({ leftId: m.dataset.left, rightId }));
        });
        payload = { pairs };
      } else if (q.type === 'ORDERING') {
        const ids = Array.from(document.getElementById('order-list').children).map(li => li.id.replace('ord-',''));
        payload = { orderedItemIds: ids };
      } else if (q.type === 'NUMERIC') {
        const v = Number(document.getElementById('num').value); payload = { value: v };
      } else { const t = document.getElementById('text').value; payload = { text: t }; }
      await apiFetch(`/api/v1/attempts/${attemptId}/answer`, { method: 'POST', body: JSON.stringify({ examItemId: currentItem.examItemId, answerPayload: payload }) });
      alert('Answer saved');
    }

    async function submitAnswer(obj) {
      await apiFetch(`/api/v1/attempts/${attemptId}/answer`, { method: 'POST', body: JSON.stringify({ examItemId: currentItem.examItemId, answerPayload: obj }) });
      alert('Answer saved');
    }

    async function finishAttempt() {
      const res = await apiFetch(`/api/v1/attempts/${attemptId}/submit`, { method: 'POST' });
      alert('Attempt submitted. Total score: ' + res.totalScore);
      localStorage.setItem('lastReview', JSON.stringify(res.review));
      window.location.href = '/static/review.html';
    }
  </script>
</body>
</html>
