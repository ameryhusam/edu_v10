<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Question Bank — Login</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Login</h1>
  <div>
    <label>Username or Email: <input id="username" /></label><br />
    <label>Password: <input id="password" type="password" /></label><br />
    <button id="login">Login</button>
  </div>
  <div id="msg"></div>
  <script>
    document.getElementById('login').addEventListener('click', async () => {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/api/v1/auth/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username, password }) });
      const j = await res.json();
      if (res.ok) {
        localStorage.setItem('qb_token', j.token);
        localStorage.setItem('qb_user', JSON.stringify(j.user));
        window.location.href = '/static/index.html';
      } else {
        document.getElementById('msg').innerText = j.error || 'Login failed';
      }
    });
  </script>
</body>
</html>
