<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Review</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Review</h1>
  <div id="review"></div>
  <script>
    const r = JSON.parse(localStorage.getItem('lastReview') || '[]');
    const container = document.getElementById('review');
    container.innerHTML = '<pre>' + JSON.stringify(r, null, 2) + '</pre>';
  </script>
</body>
</html>
