<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Create Exam</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Create Exam</h1>
  <div>
    <label>Title: <input id="title"></label>
    <button id="load">Load questions</button>
    <div id="pool"></div>
    <button id="create">Create Exam</button>
  </div>
  <div id="out"></div>
  <script>
    let selected = new Set();
    document.getElementById('load').addEventListener('click', async () => {
      const res = await fetch('/api/v1/questions');
      const data = await res.json();
      const pool = document.getElementById('pool');
      pool.innerHTML = '';
      data.rows.forEach(q => {
        const cb = document.createElement('input'); cb.type = 'checkbox'; cb.value = q.id; cb.addEventListener('change', (e) => { if(e.target.checked) selected.add(e.target.value); else selected.delete(e.target.value); });
        const label = document.createElement('label'); label.appendChild(cb); label.append(' ' + (q.key || q.id) + ' - ' + q.type);
        pool.appendChild(label); pool.appendChild(document.createElement('br'));
      });
    });

    document.getElementById('create').addEventListener('click', async () => {
      const title = document.getElementById('title').value || 'Practice Exam';
      const body = { title, questionIds: Array.from(selected) };
      const res = await fetch('/api/v1/exams', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const json = await res.json();
      document.getElementById('out').innerText = 'Exam created: ' + JSON.stringify(json);
    });
  </script>
</body>
</html>
