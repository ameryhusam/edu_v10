<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Create Exam — Question Bank</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Create Exam</h1>
  <p><a href="/static/login.html">Login</a></p>
  <div>
    <label>Title: <input id="title" /></label>
    <label>Questions (comma-separated IDs): <input id="qids" /></label>
    <button id="create">Create Fixed Exam</button>
  </div>
  <div id="result"></div>
  <script type="module">
    import { apiFetch } from './api.js';
    document.getElementById('create').addEventListener('click', async () => {
      const title = document.getElementById('title').value;
      const qids = document.getElementById('qids').value.split(',').map(s => s.trim()).filter(Boolean);
      const token = localStorage.getItem('qb_token');
      const res = await fetch('/api/v1/exams', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': token ? 'Bearer ' + token : '' }, body: JSON.stringify({ title, questionIds: qids }) });
      const j = await res.json();
      if (res.ok) document.getElementById('result').innerText = 'Exam created: ' + j.exam.id;
      else document.getElementById('result').innerText = 'Error: ' + (j.error || JSON.stringify(j));
    });
  </script>
</body>
</html>
