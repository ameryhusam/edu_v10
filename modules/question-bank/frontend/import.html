<!-- enhance import.html: add Excel upload and export XLSX button -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Import Preview</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Import Preview</h1>
  <p><a href="/static/login.html">Login</a> to perform approvals.</p>
  <p>Preview the bundled sample questions and approve them into the question bank.</p>
  <div>
    <label>Sample file: <input id="sampleFile" value="questions.json"></label>
    <button id="preview">Preview JSON</button>
  </div>
  <div>
    <label>Excel file: <input type="file" id="excelFile" accept=".xlsx,.xls" /></label>
    <button id="uploadExcel">Upload Excel & Preview</button>
    <button id="exportXlsx">Export XLSX (current lesson)</button>
  </div>
  <div id="jobs"></div>
  <h2>Imported Questions</h2>
  <div id="imported"></div>
  <script type="module">
    import { apiFetch } from './api.js';

    async function renderJobs() {
      const jobs = await apiFetch('/api/v1/imports');
      const container = document.getElementById('jobs');
      container.innerHTML = '';
      jobs.forEach(job => {
        const div = document.createElement('div');
        div.innerHTML = `<h3>Job ${job.id} (${job.status})</h3><button data-id="${job.id}" class="approve">Approve</button><pre>${JSON.stringify(job.items, null, 2)}</pre>`;
        container.appendChild(div);
      });
      document.querySelectorAll('.approve').forEach(btn => btn.addEventListener('click', async (e) => {
        const id = e.target.dataset.id;
        const r = await fetch(`/api/v1/imports/${id}/approve`, { method: 'POST', headers: {'Authorization': 'Bearer ' + localStorage.getItem('qb_token')} });
        const json = await r.json();
        alert('Imported ' + json.imported + ' items');
        loadImported();
        renderJobs();
      }));
    }

    async function loadImported() {
      const data = await apiFetch('/api/v1/questions');
      const container = document.getElementById('imported');
      container.innerHTML = '<pre>' + JSON.stringify(data.rows, null, 2) + '</pre>';
    }

    document.getElementById('preview').addEventListener('click', async () => {
      const sampleFile = document.getElementById('sampleFile').value;
      const res = await apiFetch('/api/v1/imports/preview-from-sample', { method: 'POST', body: JSON.stringify({ sampleFile })});
      alert('Preview created');
      renderJobs();
    });

    document.getElementById('uploadExcel').addEventListener('click', async () => {
      const fileInput = document.getElementById('excelFile');
      if (!fileInput.files || fileInput.files.length === 0) { alert('Select a file'); return; }
      const fd = new FormData(); fd.append('file', fileInput.files[0]);
      const token = localStorage.getItem('qb_token');
      const res = await fetch('/api/v1/imports/preview-from-excel', { method: 'POST', body: fd, headers: token ? { 'Authorization': 'Bearer ' + token } : undefined });
      const j = await res.json();
      alert('Excel preview created: ' + j.jobId);
      renderJobs();
    });

    document.getElementById('exportXlsx').addEventListener('click', async () => {
      const lessonKey = prompt('Enter lessonKey to export (e.g. MATH-G05-U01-L01)');
      if (!lessonKey) return;
      window.location.href = `/api/v1/export.xlsx?lessonKey=${encodeURIComponent(lessonKey)}`;
    });

    renderJobs();
    loadImported();
  </script>
</body>
</html>
